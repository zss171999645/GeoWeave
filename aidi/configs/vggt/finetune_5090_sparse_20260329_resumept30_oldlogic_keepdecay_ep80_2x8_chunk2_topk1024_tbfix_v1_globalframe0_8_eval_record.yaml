configs:
    - ./finetune_5090_sparse_topk2048_l9_19_p34_record.yaml

model_cfg:
    vggt_cfg:
        indexer_cfg:
            topk: 1024
            sparse_lr_decay: cap
        aggregator_cfg:
            # Keep global block weights, but run layers 0-8 with frame-local attention range.
            global_frame_attention_layers: "0-8"
        depth_head_cfg:
            chunk_cfg:
                frames_chunk_size: 2
        point_head_cfg:
            chunk_cfg:
                frames_chunk_size: 2
