run:
  name: vggt_unified_eval_local
  gpu_ids: auto
  device: auto
  output_root: tmp/vggt_unified_eval_local
  save_root: /horizon-bucket/saturn_v_dev/01_users/feng01.zhou/projects/meshx/baseline
  skip_existing: false
  allow_co3dv2_videodepth: false
  auto_skip_known_oom_official_videodepth_on_5090: true
  force_run_known_oom_tasks: []

model:
  kind: official
  official_ckpt_root: /horizon-bucket/saturn_v_dev/01_users/tao02.xie/projects/GFM/gfm/data/trained_model/vggt/official/VGGT-1B
  checkpoint: ""
  config: ""

# 统一使用按数据集组织的配置。
# 每个数据集下面只打开你要跑的评测类型；同一数据集可以同时开 pose/depth/pointcloud。
# 旧的 tasks/families 扁平配置已经移除。
# 这个文件默认预填当前 bucket 上已验证/已使用的数据根，但默认所有任务都关闭。
# 真正运行前，至少要把一个 `enabled: true` 打开，否则脚本会报 `No dataset-centric eval tasks enabled.`
# DIODE 当前没有可用默认根，保留空值；需要跑 DIODE 时先填 data_root。
datasets:
  re10k:
    root: /horizon-bucket/saturn_v_dev/01_users/feng01.zhou/datasets/re10k/processed_pose1800_clusterfix/test
    pose:
      enabled: false
      limit_scenes: 0

  co3dv2:
    image_root: /horizon-bucket/saturn_v_4dlabel/009_geo/002_data/dust3r_datasets/dust3r_extracted/co3dv2
    setlist_root: /horizon-bucket/saturn_v_4dlabel/009_geo/002_data/dust3r_datasets/dust3r_extracted/co3dv2
    anno_dir: /horizon-bucket/saturn_v_dev/01_users/feng01.zhou/projects/meshx/baseline/eval_datasets/co3d_official_annos_co3d_setlists_seen41_test
    shared_image_root: /horizon-bucket/saturn_v_dev/01_users/feng01.zhou/projects/meshx/baseline/eval_datasets/co3d_official_image_mirror_co3d_setlists_seen41_test_full
    data_root: /horizon-bucket/saturn_v_dev/01_users/feng01.zhou/datasets/co3dv2/test
    data_root_candidates:
      - /horizon-bucket/saturn_v_dev/01_users/feng01.zhou/datasets/co3dv2/test
      - /horizon-bucket/saturn_v_4dlabel/004_vision/01_users/yingfeng.cai/evc_data/co3dv2/test
    data_root_min_categories: 41
    data_root_min_scenes: 20000
    pose:
      enabled: false
      num_frames: 10
    depth:
      monodepth:
        enabled: false
        max_seqs: 0
        max_frames_per_seq: 0
      videodepth:
        enabled: false
        max_seqs: 0
        max_frames_per_seq: 0

