# @package _global_

trainer: trainers.pi3_trainer.Pi3Trainer

train:
  image_num_range: [2, 24]
  max_img_per_gpu: 64
  find_unused_parameters: true
  static_graph: true
  resolution:
    - [224, 224]

model:
  ckpt: null
  num_dec_blk_not_to_checkpoint: 999
  indexer_cfg:
    enabled: true
    indexer_layers: "all"
    n_heads: 4
    head_dim: 64
    enable_sparse: false
    warmup_steps: 40000
    sparse_start_step: 40000
    warmup_only_indexer_loss: true
    warmup_only_indexer_train: true
    warmup_optimizer_filter: true
    warmup_lr: 1.0e-3
    sparse_lr: null
    score_dtype: float16
    use_sparse_flash_attn: true
    use_topk_kernel: true
    init_from_attn: true
