# Fix the random seed and set deterministic behavior
fix_random: True
deterministic: True

# Configuration for VGGT
configs:
    - configs/base.yaml # default arguments for the whole codebase
    - configs/models/vggt.yaml # network model configuration

model_cfg:
    sampler_cfg:
        vggt_batching: True # use the custom VGGT batching

val_dataloader_cfg:
    num_workers: 0 # make fix_random and deterministic work
    dataset_cfg:
        _delete_: True
        type: GeneralizableDataset
        split: VAL
        runtime_build: False
        dataset_indexing: True
        parallel_loading: True
        dataloading_workers: 64
        disk_dataset: True
        fix_random: True
        # IMPORTANT: override configs/base.yaml val_dataloader_cfg.dataset_cfg.{frame_sample,view_sample}
        # so they don't overwrite metaset_cfgs[-1] and break the paper protocol (random 10 views/scene).
        view_sample: [0, null, 1]
        frame_sample: [0, null, 1]
        meta_roots:
            - /horizon-bucket/saturn_v_dev/01_users/feng01.zhou/datasets/re10k/processed_pose1800
        metaset_cfgs:
            - dataset_name: "re10k/processed_pose1800"
              ims_pattern: '{frame:06d}.jpg'
              dist_opt_K: True
              # RE10K official metadata uses world-to-camera extrinsics.
              extri_type: w2c
              min_depth_quantile: 0.0
              max_depth_quantile: 0.98
            - type: MultiviewPointDataset
              ddp_shard_dataset: False
              n_rays: -1
              # Use VGGT official eval preprocessing (crop mode) to match paper protocol.
              vggt_official_preprocess: True
              vggt_official_preprocess_mode: crop
              vggt_official_target_size: 518
              # Disable VolumetricVideoDataset resizing; official preprocess handles resizing/cropping/padding.
              max_size: -1
              align_size: 1
              disk_dataset: True # to avoid loading all data into memory
              dist_opt_K: False # no distortion for synthetic data
              use_masks: False
              use_depths: False
              use_vhulls: False
              view_sample: [0, null, 1]
              frame_sample: [0, null, 1]
              # RE10K is monocular video; treat temporal dimension as the view pool for src selection.
              closest_using_t: True
              # VGGT paper protocol: random 10 images per scene.
              source_type: RANDOM
              min_depth_quantile: 0.0
              max_depth_quantile: 1.0
              scale_type: DIST
              n_srcs_list: [9]
              n_srcs_prob: [1.0]
    sampler_cfg:
        view_sample: [0, null, 1]
        frame_sample: [0, null, 1] # evaluate all available scenes in the official subset
    batch_sampler_cfg:
        n_srcs_list: [9]
        n_srcs_prob: [1.0]


# prettier-ignore
exp_name: {{fileBasenameNoExtension}}
