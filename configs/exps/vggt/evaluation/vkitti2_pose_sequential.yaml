              use_depths: False
              use_vhulls: False
              view_sample: [0, null, 1]
              frame_sample: [0, null, 1]
              # Long-sequence sweep protocol: use a sequential temporal window around the target.
              closest_using_t: True
              source_type: SEQUENTIAL
              scale_type: DIST
              n_srcs_list: [9]
              n_srcs_prob: [1.0]
    sampler_cfg:
