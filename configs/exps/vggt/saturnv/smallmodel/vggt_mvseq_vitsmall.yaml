              n_srcs_prob: &val_n_srcs_probs [1.0]
              min_depth_quantile: 0.0
              max_depth_quantile: 1.0
              source_type: MULTIVIEWSEQ
              extra_src_pool: 5  # expand the source pool to twice the number of sources
              dist_opt_K: False # no distortion for synthetic data
              use_depths: True # use ground truth depths for evaluation
              use_world_coord: True
              scale: 15.0
              scale_type: MANUAL
              use_3ddr: True
              meta_file: __meta_3ddr.pkl

    sampler_cfg:
        type: DistributedSequentialSampler
        view_sample: [0, null, 1]
        frame_sample: [0, null, 1500]
    batch_sampler_cfg:
        n_srcs_list: *val_n_srcs_list  # copied from dataset_cfg
        n_srcs_prob: *val_n_srcs_probs  # copied from dataset_cfg

