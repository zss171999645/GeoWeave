            - dataset_name: "parking_test"
              ratio: 1.0
              interp_using_t: True
              closest_using_t: True
              sparse_interpolate: True
              min_depth: 0.5
              max_depth: 60
              use_png_depth: True
              ims_pattern: '{frame:05d}.jpg'
              mks_pattern: '{frame:05d}.png'
              dps_pattern: '{frame:05d}.png'
              is_bussi_data: True
              view_sample: [6, null, 1]

            - dataset_name: "driving_test"
              ratio: 1.0
              interp_using_t: True
